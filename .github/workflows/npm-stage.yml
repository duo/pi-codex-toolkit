name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag to stage, such as v0.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-stage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      sha512: ${{ steps.package.outputs.sha512 }}

    steps:
      - name: Validate selected tag
        env:
          REF_IS_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "duo/pi-codex-toolkit" ]]
          [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SELECTED_REF" == "refs/tags/$REQUESTED_TAG" ]]
          [[ "$REF_IS_PROTECTED" == "true" ]]

      - name: Check out artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
          path: artifact-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Verify toolchain and release tag
        working-directory: artifact-source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'node=%s\nnpm=%s\n' "$(node --version)" "$(npm --version)"
          [[ "$(node --version)" == "v24.20.0" ]]
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          git rev-parse "$REQUESTED_TAG^{tag}" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$REQUESTED_TAG^{commit}")" ]]
          [[ "$(git show -s --format=%s HEAD)" == "release: $REQUESTED_TAG" ]]

          version="${REQUESTED_TAG#v}"
          REQUESTED_VERSION="$version" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const version = process.env.REQUESTED_VERSION;
            if (pkg.name !== "pi-codex-toolkit" || pkg.version !== version) throw new Error("Package version differs from tag");
            if (lock.version !== version || lock.packages?.[""]?.version !== version) throw new Error("Lockfile version differs from tag");
          '

          read -r -a ancestry <<<"$(git rev-list --parents -n 1 HEAD)"
          [[ "${#ancestry[@]}" -le 2 ]]

      - name: Pack and inspect canonical tarball
        id: package
        working-directory: artifact-source
        env:
          PACK_DIRECTORY: ${{ runner.temp }}/npm-package
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            find . -path './.git' -prune -o -printf '%y %P\0' | LC_ALL=C sort -z
            find . -path './.git' -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          snapshot > "$RUNNER_TEMP/source.before"
          mkdir "$PACK_DIRECTORY"
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIRECTORY" \
            > "$RUNNER_TEMP/npm-pack.json"
          snapshot > "$RUNNER_TEMP/source.after"
          cmp "$RUNNER_TEMP/source.before" "$RUNNER_TEMP/source.after"
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

          filename="$(REQUESTED_VERSION="${REQUESTED_TAG#v}" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (report.length !== 1 || report[0].name !== "pi-codex-toolkit") throw new Error("Unexpected pack result");
            if (report[0].version !== process.env.REQUESTED_VERSION) throw new Error("Packed version differs from tag");
            process.stdout.write(report[0].filename);
          ' "$RUNNER_TEMP/npm-pack.json")"
          [[ "$filename" =~ ^pi-codex-toolkit-[0-9A-Za-z._-]+\.tgz$ ]]
          [[ -f "$PACK_DIRECTORY/$filename" ]]

          tar -tzf "$PACK_DIRECTORY/$filename" | LC_ALL=C sort > "$RUNNER_TEMP/members.txt"
          ! grep -Ev '^package/' "$RUNNER_TEMP/members.txt"
          ! grep -Eq '(^|/)(\.\.?|tests|\.github|node_modules)(/|$)' "$RUNNER_TEMP/members.txt"
          for member in \
            package/package.json \
            package/src/index.ts \
            package/CHANGELOG.md \
            package/LICENSE \
            package/NOTICE \
            package/docs/third-party/Apache-2.0.txt \
            package/docs/third-party/openai-codex-apply-patch-NOTICE.txt; do
            grep -Fqx "$member" "$RUNNER_TEMP/members.txt"
          done

          cd "$PACK_DIRECTORY"
          sha512="$(sha512sum "$filename" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$sha512" "$filename" > SHA512SUMS
          printf 'filename=%s\nsha512=%s\n' "$filename" "$sha512" >> "$GITHUB_OUTPUT"

      - name: Check out test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          path: test-source
          persist-credentials: false

      - name: Test source
        working-directory: test-source
        run: |
          npm ci --ignore-scripts
          npm test
          npm run typecheck
          npm run format:check

      - name: Verify exact tarball with Pi 0.84.4
        working-directory: test-source
        env:
          FILENAME: ${{ steps.package.outputs.filename }}
          PACK_DIRECTORY: ${{ runner.temp }}/npm-package
        shell: bash
        run: |
          set -euo pipefail
          install_prefix="$RUNNER_TEMP/npm-install"
          agent_directory="$RUNNER_TEMP/pi-agent"
          mkdir "$install_prefix" "$agent_directory"
          npm install --prefix "$install_prefix" --ignore-scripts --legacy-peer-deps \
            "$PACK_DIRECTORY/$FILENAME"

          installed_package="$install_prefix/node_modules/pi-codex-toolkit"
          pi_command="$GITHUB_WORKSPACE/test-source/node_modules/.bin/pi"
          [[ -f "$installed_package/src/index.ts" && -x "$pi_command" ]]

          for attempt in 1 2; do
            status_file="$RUNNER_TEMP/pi-status-$attempt.txt"
            PI_CODING_AGENT_DIR="$agent_directory" PI_OFFLINE=1 NO_COLOR=1 FORCE_COLOR=0 \
              timeout 90 "$pi_command" \
                --no-extensions --extension "$installed_package" \
                --no-skills --no-prompt-templates --no-themes --no-context-files \
                --approve --no-session --print '/pct status' > "$status_file"
            [[ "$(grep -c '^  configured: off$' "$status_file")" -eq 5 ]]
            [[ "$(grep -c '^  effective: off$' "$status_file")" -eq 5 ]]
          done

          [[ ! -e "$agent_directory/extensions/pi-codex-toolkit.json" ]]
          [[ ! -e "$agent_directory/artifacts/pi-codex-toolkit" ]]
          cd "$PACK_DIRECTORY"
          sha512sum --check --strict SHA512SUMS

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-stage-package
          path: |
            ${{ runner.temp }}/npm-package/${{ steps.package.outputs.filename }}
            ${{ runner.temp }}/npm-package/SHA512SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  stage:
    name: Stage verified package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-stage
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-stage-package
          path: ${{ runner.temp }}/npm-package

      - name: Verify artifact and toolchain
        env:
          EXPECTED_FILENAME: ${{ needs.verify.outputs.filename }}
          EXPECTED_SHA512: ${{ needs.verify.outputs.sha512 }}
          PACK_DIRECTORY: ${{ runner.temp }}/npm-package
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'node=%s\nnpm=%s\n' "$(node --version)" "$(npm --version)"
          [[ "$(node --version)" == "v24.20.0" ]]
          [[ "$(npm --version)" == "11.19.0" ]]
          [[ -z "${NPM_TOKEN+x}" && -z "${NODE_AUTH_TOKEN+x}" ]]
          [[ "$EXPECTED_FILENAME" =~ ^pi-codex-toolkit-[0-9A-Za-z._-]+\.tgz$ ]]
          [[ "$EXPECTED_SHA512" =~ ^[0-9a-f]{128}$ ]]

          mapfile -t files < <(find "$PACK_DIRECTORY" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          [[ "${#files[@]}" -eq 2 ]]
          cd "$PACK_DIRECTORY"
          sha512sum --check --strict SHA512SUMS
          [[ "$(sha512sum "$EXPECTED_FILENAME" | cut -d ' ' -f 1)" == "$EXPECTED_SHA512" ]]
          tar -xOzf "$EXPECTED_FILENAME" package/package.json \
            | REQUESTED_VERSION="${REQUESTED_TAG#v}" node --input-type=module -e '
                let source = "";
                for await (const chunk of process.stdin) source += chunk;
                const pkg = JSON.parse(source);
                if (pkg.name !== "pi-codex-toolkit" || pkg.version !== process.env.REQUESTED_VERSION) {
                  throw new Error("Artifact identity differs from tag");
                }
              '

      - name: Stage package on npm
        env:
          FILENAME: ${{ needs.verify.outputs.filename }}
          PACK_DIRECTORY: ${{ runner.temp }}/npm-package
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          npm stage publish "$PACK_DIRECTORY/$FILENAME" \
            --access public --tag latest --ignore-scripts \
            --registry https://registry.npmjs.org/
